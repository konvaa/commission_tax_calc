name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows only: it is the target platform (the .exe is built there too),
    # and unlike Ubuntu runners it needs no system packages for Qt, so CI does
    # not depend on Ubuntu package mirrors being reachable.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]  # oldest supported + the one used for the release
    runs-on: windows-latest
    env:
      # Qt widgets without a display (no window appears in CI).
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Tests
        run: python -m pytest -v
