name: Release

# Push a tag like "v0.1.0" to build the Windows .exe and attach it to a
# GitHub release:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the release

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install ".[dev]" pyinstaller

      - name: Tests
        run: python -m pytest -q

      - name: Install Tesseract OCR (bundled into the .exe)
        # The .exe ships Tesseract with the Czech model, so scanned invoices
        # work without the user installing anything.
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $tess = "C:\Program Files\Tesseract-OCR"
          Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/ces.traineddata" `
            -OutFile "$tess\tessdata\ces.traineddata"
          & "$tess\tesseract.exe" --list-langs

      - name: Build .exe
        # --onefile: a single portable file; --windowed: no console window;
        # --collect-data: bundle rules/*.json and translations/*.qm;
        # --add-data: the Tesseract folder, found at runtime by core/ocr.py.
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name CommissionTaxCalc
          --collect-data commission_tax_calc
          --add-data "C:\Program Files\Tesseract-OCR;tesseract"
          packaging/launcher.py

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/CommissionTaxCalc.exe
          generate_release_notes: true
