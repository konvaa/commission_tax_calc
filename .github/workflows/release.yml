name: Release

# Push a tag like "v0.1.0" to build the Windows .exe and attach it to a
# GitHub release:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write  # needed to create the release

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install ".[dev]" pyinstaller

      - name: Tests
        run: python -m pytest -q

      - name: Build .exe
        # --onefile: a single portable file; --windowed: no console window;
        # --collect-data: bundle rules/*.json and translations/*.qm.
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name CommissionTaxCalc
          --collect-data commission_tax_calc
          packaging/launcher.py

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/CommissionTaxCalc.exe
          generate_release_notes: true
