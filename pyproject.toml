[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commission-tax-calc"
version = "0.2.0"
description = "Sums FinTrust commission statements and issued invoices (ISDOC, PDF, OCR) and computes flat-rate expenses for the Czech tax return."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Libor Konvičný" }]
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",      # PDF text; brings pypdfium2 (rendering, ISDOC attachments)
    "PySide6>=6.6",
    "pytesseract>=0.3.10",   # OCR of scanned invoices (needs the Tesseract program)
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: Czech",
    "Natural Language :: English",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "reportlab>=4",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/konvaa/commission_tax_calc"

[project.gui-scripts]
commission-tax-calc = "commission_tax_calc.gui.app:main"

[project.scripts]
commission-tax-calc-cli = "commission_tax_calc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
commission_tax_calc = ["rules/*.json", "translations/*.qm", "translations/*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `pytest` import the package from src/ even without `pip install -e .`.
pythonpath = ["src"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["commission_tax_calc", "factory"]
